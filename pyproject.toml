[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkit-scraper"
version = "0.1.0"
description = "Scrape Blinkit categories and product pages (price, MRP, stock per dark store, FSSAI licence, shelf life) with Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["blinkit", "web scraping", "quick commerce", "grocery", "scraper", "cloudflare", "india"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/bugrahansss/blinkit-scraper"
Source = "https://github.com/bugrahansss/blinkit-scraper"
Issues = "https://github.com/bugrahansss/blinkit-scraper/issues"
"Scrape.do" = "https://scrape.do/?utm_source=pypi&utm_medium=package&utm_campaign=blinkit-scraper"

[project.scripts]
blinkit-scraper = "blinkit_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
